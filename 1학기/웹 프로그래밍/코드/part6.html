<!DOCTYPE html>
<html>
    <head>
        <title>part6</title>
        <style>
            .header{
                transform : skew(5deg, 5deg);
                font-size : 100px;
                font-family: cursive;

                text-align: center;

                border-top : solid 1px red;
                border-bottom : solid 1px red;
            }

            body{
                display : flex;
                flex-direction: row;
                justify-content : center;
                font-size : 20px;

                margin : 30px;
            }

            
        </style>
    </head>
    <body>
        <h1 class = "header">part6</h1>


        <script>

            //배열
            let students = ["태호", "태태호", "태태태호"];
            students[0] = "ㅌㅎ";

            //배열순회
            for(let i = 0; i< students.length; i++){
                document.write(students[i] + "<br>");
            }

            document.write(typeof(students) + "<br>"); //object


            //객체 method
            let superman = {
                name : "clark",
                age : null,
                fly : function(){
                    document.write(`${this.name} is flying` + "<br>");
                }
            }

            superman.fly();

            //객체 순회
            let person={name : "태호", age : 20};

            for(let i in person){
                document.write(i + " = " + person[i] + "<br>");
            }

            document.write(typeof(person));

            //배열 추가, 삭제
            students.push("태태태태태호");  //추가
            students.unshift("호") //앞에 추가
            students.pop(); //삭제
            students.shift() //앞에서 삭제

            //반복처리
            students.forEach(function(students, index){
                document.write(index + ": " +students + "<br>");
            });

            let me = ["trash", "needy", "disgusting"];
            
            me.forEach(function(me, i){
                if(i < 2){
                    document.write(i + " prospect : " + me + ", ");
                }
                if(i === 2){
                    document.write(i + "last prospect : " + me + "<br>");
                }
                else{
                    document.write(i + "rst or nd prospect : " + me + "<br>");
                }
            });

            let mylove = ["alina"];
            
            mylove.forEach(function(mylove, i){
                document.write(i + "=" + mylove + "=" + "mommy" + "<br>");
            })

            //검색과 필터링
            let scores = [85, 92, 32, 45, 48];
            let high_score = scores.filter(i => i>50); //50점 이상
            document.write(high_score + "<br>");
            let f = scores.find(score => score === 92);
            document.write(f + "<br>");

            //변형 
            document.write(students.map(i => "안녕하세요, " + i + "님" + "<br>"));

            //정렬, 역순
            document.write(scores.sort((a,b)=>a-b) +"<br>");
            document.write(scores.reverse());

            //배열 합치기와 잘라내기
            let a = [1,2];
            let b = [3,4];
            let combined = a.concat(b); //합침 
            document.write(combined + "<br>");
            let sliced = combined.slice(1,3); //의 위치 없애기
            document.write(sliced);

            //배열 포함 확인 여부
            let tools = ["망치", "톱", "드라이버"];
            document.write(tools.includes("ㅅㅂ") + "<br>");
            document.write(tools.indexOf("톱") + "<br>");
            //배열 인덱스를 초과한거나 없는걸 요구하면 undefined반환

            //객체배열
            let users = [
                {name : "재한"},
                {name : "뽀큐"},
                {name : "ㄱㅁㄸ"}
            ];

            //있는지 확인 = includes대신 some
            document.write("<br>"+users.some(users => users.name === "수지") + "<br>");

            let people = [{n : "tq"}, {a : 22}, {h : 171}];
            document.write(people.some(p => p.n === "ddd") + "<br>");

            //문자열 배열에서 글자 수가 3이하인 것만 추출
            let animals = ["cat", "dog", "elephant", "giraffe"];
            document.write(animals.filter(a => a.length <= 3) + "<br>");

            //짝수만 2배
            let num = [1,2,3,4,5,6];
            let num2 = num.filter(a => a%2===0).map(a => a*2);
            num2.forEach(function(a, b){
                document.write(b + "번째 인덱스 값 : " + a +"<br>");
            })

            //나이순 정렬
            let users2 = [
                {name : "taeho", age: 22},
                {name : "alina", age : 25}
            ];
            users2.sort((a, b) => a - b);
            document.write(users2 + "<br>");

            let animalss = ["고양이", "개", "코끼rllrrlrl리", "닭", "돼지"];
            let under3 = animalss.filter(a => a.length <= 3);
            document.write(under3 + "<br>");



        </script>
    </body>
</html>
