<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      #myButton {
        cursor: pointer;
        padding: 8px 16px;
      }
      #myButton:hover {
        background-color: blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="myButton">
      이벤트 핸들러용 버튼
    </div>
    <script>
      const button = document.querySelector("#myButton");

      button.addEventListener("click", function() {
        alert("버튼이 클릭되었습니다!");
      });


      let a = ["의자", "책상", "연필"];
      for(let i = 0; i < a.length; i++){
        document.write(a[i]);
      }
    </script>
  </body>
</html>
