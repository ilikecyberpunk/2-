<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뽀모도로 타이머</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="timer-card">
      <h1 class="title">뽀모도로 타이머</h1>
      <p class="mode-label" id="modeLabel">집중 시간</p>
      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="button-row">
        <button id="startPauseBtn" class="btn btn-primary">시작</button>
        <button id="resetBtn" class="btn btn-secondary">초기화</button>
      </div>

      <button id="switchModeBtn" class="btn btn-outline">집중/휴식 바꾸기</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
